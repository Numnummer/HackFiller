<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageScope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>
(function () {
  var t = localStorage.getItem("imagescope-theme") || "rose";
  if (t !== "auto") document.documentElement.setAttribute("data-theme", t);
})();
</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>ImageScope</h1>
    <p class="src">Источник: <a id="srcLink" href="#" target="_blank" rel="noopener"></a></p>
  </div>
  <label class="theme-picker">Тема
    <select id="theme" aria-label="Тема оформления">
      <option value="auto">Как в системе</option>
      <option value="paper">Светлая</option>
      <option value="ink">Тёмная</option>
      <option value="rose">Нежно-розовая</option>
    </select>
  </label>
</header>

<section class="panel controls">
  <label>Фильтр / пресет
    <select id="filter"></select>
  </label>
  <p id="filterDesc" class="hint"></p>
  <label>Интенсивность: <b id="intVal">1.00</b>
    <input id="intensity" type="range" min="0" max="1" step="0.05" value="1">
  </label>
  <label>Изображений: <b id="limVal">12</b>
    <input id="limit" type="range" min="1" max="20" step="1" value="12">
  </label>
  <button id="run" type="button">Запустить сбор</button>
</section>

<div id="status" class="status" hidden></div>

<section id="report" hidden>
  <div class="cards" id="cards"></div>
  <div class="panel" id="errPanel" hidden>
    <h2>Пропущено / ошибки</h2>
    <ul id="errors"></ul>
  </div>
  <h2 class="section-title">Галерея «до / после»</h2>
  <div id="gallery" class="gallery"></div>
</section>
<div id="modal" class="modal" hidden>
  <button class="nav prev" type="button" id="mPrev" aria-label="Назад">‹</button>
  <div class="mbody">
    <button class="close" type="button" id="mClose" aria-label="Закрыть">×</button>
    <h3 id="mTitle"></h3>
    <div class="mpair">
      <figure><img id="mBefore" alt="до"><figcaption>до</figcaption></figure>
      <figure><img id="mAfter" alt="после"><figcaption>после</figcaption></figure>
    </div>
    <p id="mMeta" class="hint"></p>
  </div>
  <button class="nav next" type="button" id="mNext" aria-label="Вперёд">›</button>
</div>
<script src="/static/app.js"></script>
</body>
</html>
